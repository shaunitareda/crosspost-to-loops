name: Rabbit Cast implementation

on:
  push:
    branches: [rabbit-cast-rest]
    paths:
      - scripts/apply-rabbit-cast.py
      - .github/workflows/rabbit-cast-implement.yml

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rabbit-cast-rest
          fetch-depth: 0
      - name: Apply surgical edits
        run: python3 scripts/apply-rabbit-cast.py
      - name: Run syntax and tests
        run: bash tests/run.sh
      - name: Commit validated implementation
        run: |
          rm -f scripts/apply-rabbit-cast.py .github/workflows/rabbit-cast-implement.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add authenticated Rabbit Cast Loops endpoint"
          git push origin HEAD:rabbit-cast-rest
