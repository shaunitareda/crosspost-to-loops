name: CTL v1.0.3 validation

on:
  push:
    branches:
      - fix-test-crosspost-dropdown-1.0.3

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
          coverage: none
      - run: bash .github/scripts/fix-test-crosspost-dropdown-1-0-3.sh
