name: Apply Loops security hardening

on:
  push:
    branches:
      - security/credential-hardening
    paths:
      - .github/workflows/security-hardening.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/credential-hardening

      - name: Apply exact security patches
        shell: python
        run: |
          from pathlib import Path

          path = Path('crosspost-to-loops.php')
          text = path.read_text(encoding='utf-8')

          def replace_once(old, new):
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(" * Version:           1.0.0", " * Version:           1.0.1")
          replace_once("define( 'CTL_VERSION', '1.0.0' );", "define( 'CTL_VERSION', '1.0.1' );")

          replace_once(
              "\t\t$clean['access_token']       = sanitize_text_field( trim( $input['access_token'] ?? '' ) );",
              "\t\t$existing                    = $this->get_settings();\n"
              "\t\t$submitted_token             = sanitize_text_field( trim( $input['access_token'] ?? '' ) );\n"
              "\t\t$clean['access_token']       = '' !== $submitted_token ? $submitted_token : (string) ( $existing['access_token'] ?? '' );"
          )

          replace_once(
              "\t\t\tesc_attr( $s['access_token'] ),",
              "\t\t\t'',"
          )

          replace_once(
              "\t\t\t\t'enable_debug'       => true,",
              "\t\t\t\t'enable_debug'       => false,"
          )

          replace_once(
              "\t\t$entries   = get_option( self::LOG_OPTION, array() );",
              "\t\t$message = $this->redact_sensitive_string( $message );\n"
              "\t\t$context = $this->redact_sensitive_value( $context );\n\n"
              "\t\t$entries   = get_option( self::LOG_OPTION, array() );"
          )

          anchor = "\t/**\n\t * AJAX handler: clears all debug log entries."
          helpers = r'''
	/**
	 * Recursively redact secrets before writing log context.
	 *
	 * @param mixed $value Value to sanitize.
	 * @param string $key Context key, when available.
	 * @return mixed
	 */
	private function redact_sensitive_value( $value, string $key = '' ) {
		$normalized = strtolower( str_replace( array( '-', '_' ), '', $key ) );
		$sensitive  = array( 'password', 'apppassword', 'token', 'accesstoken', 'refreshtoken', 'clientsecret', 'authorization', 'bearer' );
		if ( $key && in_array( $normalized, $sensitive, true ) ) {
			return '[REDACTED]';
		}
		if ( is_array( $value ) ) {
			$clean = array();
			foreach ( $value as $child_key => $child_value ) {
				$clean[ $child_key ] = $this->redact_sensitive_value( $child_value, (string) $child_key );
			}
			return $clean;
		}
		return is_string( $value ) ? $this->redact_sensitive_string( $value ) : $value;
	}

	/**
	 * Redact common credential patterns from a log message.
	 */
	private function redact_sensitive_string( string $value ): string {
		$value = preg_replace( '/\bBearer\s+[A-Za-z0-9._~+\/-]+=*/i', 'Bearer [REDACTED]', $value );
		$value = preg_replace(
			'/(["\']?(?:client_secret|access_token|refresh_token|token|password|authorization)["\']?\s*[:=]\s*["\']?)[^"\'\s,&}]+/i',
			'$1[REDACTED]',
			$value
		);
		return $value;
	}

'''
          replace_once(anchor, helpers + anchor)

          path.write_text(text, encoding='utf-8')

      - name: PHP syntax check
        run: php -l crosspost-to-loops.php

      - name: Commit hardened source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crosspost-to-loops.php
          git commit -m "Security: harden credential and debug handling"
          git push origin HEAD:security/credential-hardening
