name: Apply Loops security hardening

on:
  push:
    branches:
      - security/credential-hardening
    paths:
      - .github/workflows/security-hardening.yml
      - scripts/security_harden.py
  workflow_dispatch:

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/credential-hardening

      - name: Apply exact security patches
        run: python3 scripts/security_harden.py

      - name: PHP syntax check
        run: php -l crosspost-to-loops.php

      - name: Commit hardened source
        run: |
          if git diff --quiet; then
            echo "No source changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crosspost-to-loops.php
          git commit -m "Security: harden credential and debug handling"
          git push origin HEAD:security/credential-hardening
